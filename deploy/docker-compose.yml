services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pagent}
      POSTGRES_DB: ${POSTGRES_DB:-protocol_platform}
    volumes:
      - ./runtime/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pagent} -d ${POSTGRES_DB:-protocol_platform}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  platform:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PROTOCOL_AGENT_PG_DSN: postgres://${POSTGRES_USER:-pagent}:${POSTGRES_PASSWORD:-pagent}@postgres:5432/${POSTGRES_DB:-protocol_platform}?sslmode=disable
      PROTOCOL_AGENT_LISTEN: ${PROTOCOL_AGENT_LISTEN:-:8787}
    ports:
      - "${PROTOCOL_AGENT_PORT:-8787}:8787"
    volumes:
      - ./runtime/data:/app/platform/data
      - ./runtime/skills:/app/platform/skills
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
